# Cash Shop catalog
#
# Item is the rAthena AegisName, not the numeric item ID.
# Price is paid from the account variable #CASHPOINTS.
#
# Suggested default income:
#   15 points per 10 minutes online
#    15 points per 100 monster kills
# Prices can be changed freely below without touching the reward script.

