name: Build and Release Mod Zip

# Runs when a release is published, from the GitHub website or the command line,
# and attaches the mod as cash-shop-extended-v<version>.zip -- the name Ragnarok
# Offline's mod registry looks for (cash-shop-extended-*.zip).
#
# On GitHub: raise "version" in cash-shop-extended/mod.json (e.g. 2.8.0) and
# commit, then Releases -> Draft a new release -> Choose a tag -> type v2.8.0 ->
# "Create new tag: v2.8.0 on publish" -> add a title and notes -> Publish release.
# The zip appears on the release a minute or so later.
#
# From the command line, the same thing: gh release create v2.8.0 --generate-notes

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the version from mod.json
        id: version
        run: |
          version=$(jq -r .version cash-shop-extended/mod.json)
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Release tag $tag does not match mod.json version $version. Raise the version in cash-shop-extended/mod.json and commit, then delete this release and its tag and publish one tagged v$version."
            exit 1
          fi
          echo "zip=cash-shop-extended-v$version.zip" >> "$GITHUB_OUTPUT"

      # Only the mod folder, so the zip has exactly one top-level folder with
      # mod.json inside it. The app refuses a zip with anything else at the top.
      - name: Create Zip Archive
        run: zip -r "${{ steps.version.outputs.zip }}" cash-shop-extended -x '*.DS_Store' '*/__MACOSX/*'

      - name: Release Zip to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.zip }}
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
